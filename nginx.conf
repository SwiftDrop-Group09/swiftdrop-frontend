server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # Frontend-only image: ingress must send /api to YARP, not this server.
  location = /api { default_type application/json; return 502 '{"message":"Gateway routing required"}'; }
  location ^~ /api/ { default_type application/json; return 502 '{"message":"Gateway routing required"}'; }
  location ^~ /assets/ { try_files $uri =404; expires 1y; add_header Cache-Control "public, immutable"; }
  location ~* \.[a-z0-9]+$ { try_files $uri =404; }
  location = /index.html { add_header Cache-Control "no-cache"; }
  location / { try_files $uri /index.html; }
}
